[package]
name = "lending"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { version = "25.3.1", features = ["alloc"] }
sep-40-oracle = { version = "1.4.0" }

[dev-dependencies]
soroban-sdk = { version = "25.3.1", features = ["testutils", "alloc"] }
sep-40-oracle = { version = "1.4.0", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils", "sep-40-oracle/testutils"]
